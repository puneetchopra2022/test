<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Someone Special 💛</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a1a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 80%;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.7);
    }

    #line {
      font-size: 22px;
      min-height: 40px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    .show {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* floating hearts */
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>💖 For You 💖</h1>
  <div id="line"></div>
</div>

<!-- Optional music -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const lines = [
    "Haye...",
    "Haye...",
    "Haye...",
    "Mera yaar sajan tu dildaar sajan tu",
    "Mainu kol luka le gal seenay la le",
    "Ghar aaja mahi fer na ja mahi",
    "Tere tarley pavaan tenu kinj samjhawan",
    "Ik wari aaja ghar phera paja",
    "Koi lab ke leya de mere dil da ranjha",
    "Rabb teri khudaai main devaan duhai",
    "Os be kadre nu meri qadar na aai",
    "Haye..."
  ];

  let index = 0;
  const lineEl = document.getElementById("line");

  function typeLine(text, callback) {
    let i = 0;
    lineEl.innerHTML = "";
    lineEl.classList.add("show");

    function typing() {
      if (i < text.length) {
        lineEl.innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 40);
      } else {
        setTimeout(() => {
          lineEl.classList.remove("show");
          setTimeout(callback, 800);
        }, 1200);
      }
    }

    typing();
  }

  function nextLine() {
    if (index < lines.length) {
      typeLine(lines[index], () => {
        index++;
        nextLine();
      });
    }
  }

  nextLine();

  // floating hearts generator
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (10 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }

  setInterval(createHeart, 500);
</script>

</body>
</html>
